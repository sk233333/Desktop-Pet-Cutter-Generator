name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deps
        # anim.py 用 PIL 读眼眶 mask；launch.py 顶层 import matplotlib，
        # 测试要导入 save_hair_polys 就会带上它，漏了在 import 阶段直接红
        run: pip install numpy opencv-python-headless pillow matplotlib pytest
      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
          MPLBACKEND: Agg          # 无 X 环境，别让 launch.py 切 TkAgg
        run: |
          set -o pipefail
          python -m pytest tests -q | tee pytest.log
          tail -1 pytest.log >> "$GITHUB_STEP_SUMMARY"
